name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML workflows
        run: |
          for f in .github/workflows/*.yml; do
            echo "Checking $f"
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" && echo "  OK"
          done

      # Este repositório foi aposentado: o que resta são páginas de
      # redirecionamento para kielima.com/ppt. Se alguém acrescentar conteúdo
      # aqui de novo, ele não vai a lugar nenhum — o endereço divulgado é o
      # outro. Falhar aqui é mais barato que descobrir isso depois.
      - name: Só redirecionamentos devem existir
        run: |
          esperado="./.github/workflows/auto-merge.yml
          ./.github/workflows/ci.yml
          ./.nojekyll
          ./CLAUDE.md
          ./README.md
          ./dissertacao/index.html
          ./index.html"
          atual=$(find . -not -path './.git/*' -type f | sort)
          if [ "$(echo "$esperado" | sed 's/^ *//')" != "$atual" ]; then
            echo "ERRO: o conteúdo do repositório mudou."
            echo "--- esperado ---"; echo "$esperado" | sed 's/^ *//'
            echo "--- atual ---";   echo "$atual"
            exit 1
          fi
          echo "OK: só os redirecionamentos."

      - name: Cada página aponta para kielima.com/ppt
        run: |
          for f in index.html dissertacao/index.html; do
            grep -q 'http-equiv="refresh"' "$f" || { echo "ERRO: $f sem meta refresh"; exit 1; }
            grep -q 'kielima.com/ppt' "$f"      || { echo "ERRO: $f não aponta para kielima.com/ppt"; exit 1; }
            echo "  OK: $f"
          done
